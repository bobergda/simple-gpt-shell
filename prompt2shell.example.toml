[openai]
api_key = ""
model = "gpt-4o-mini"
chat_language = "english"
max_retries = 2
retry_base_seconds = 1.0

[app]
profile = "safe-edit"
max_output_tokens = 1200
safe_mode = true
strict_safe_mode = false
show_tokens = true
command_timeout = 300
once_mode = false
dry_run = false
explain_only = false
json_mode = false

[logging]
enabled = false
file = "./logs/prompt2shell.log"

[report]
file = "./logs/reports/latest-session.md"
